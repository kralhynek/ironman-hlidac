name: Hlidac Ironman Hradec

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      test_alarm:
        description: "Poslat zkusebni poplach (push + hovor)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: hlidac
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Kontrola
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CALLMEBOT_USER: ${{ secrets.CALLMEBOT_USER }}
        run: |
          if [ "${{ inputs.test_alarm }}" = "true" ]; then
            python monitor.py --test-alarm
          else
            python monitor.py
          fi
      - name: Ulozit stav
        run: |
          git config user.name "hlidac-bot"
          git config user.email "hlidac-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "stav hlidace" && git push)
